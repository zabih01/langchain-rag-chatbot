[project]
name = "langchain-rag-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your Name", email = "yourgmail@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.5",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-google-genai>=4.4.1",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
]

[project.scripts]
langchain-rag-chatbot = "langchain_rag_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
